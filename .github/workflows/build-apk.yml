
name: Build Kurdistan TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q Kurdistan_Android_TV_4K_Source.zip -d appsrc

      - name: Build APK
        run: |
          cd appsrc
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Kurdistan-TV-4K-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
